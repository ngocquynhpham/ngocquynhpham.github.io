</style></head><body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">✚</div><div><b>TYT Đông Thạnh</b><small>Quản lý & giám sát ca bệnh</small></div></div><div class="side-label">KHÔNG GIAN LÀM VIỆC</div><div id="navigation"></div><div class="side-bottom"><div class="demo-pill"><b>✦ BẢN DEMO TƯƠNG TÁC</b><br>Toàn bộ bệnh nhân là dữ liệu giả lập. Chuyển role ở góc trên để thử phân quyền.</div><button class="btn sm" style="width:100%;margin-top:12px" onclick="resetDemo()">↻ Khôi phục dữ liệu demo</button></div></aside><main class="main"><header class="topbar"><div class="actions"><button class="btn sm mobile-menu" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><span class="crumb">Trang chủ / <span id="breadcrumb">Tổng quan</span></span></div><div class="topright"><span class="muted mini">Đang xem với vai trò</span><select id="rolePicker" class="role-select" onchange="switchRole(this.value)"></select><div class="avatar" id="avatar">A</div></div></header><div class="content" id="content"></div></main></div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
'use strict';
const HAMLETS=['Ấp 1','Ấp 2','Ấp 3','Ấp 4','Ấp 5','Ấp 6','Ấp 7','Ấp 8','Ấp 9','Ấp 10','Ấp 11','Ấp 12'];const DISEASES=['Sốt xuất huyết','Tay chân miệng','Sởi','Thủy đậu','Cúm A','Sốt phát ban'];const STATUSES=['VERIFYING','VERIFIED','RESOLVED'];const STLABEL={VERIFYING:'Đang xác minh',VERIFIED:'Đã xác minh',RESOLVED:'Đã xử lý'};const ROLELABEL={ROOT:'Root (ẩn khỏi quản lý)',ADMIN:'Admin · Quản trị',NVYT:'NVYT · Ấp 1 & Ấp 2',MANAGER:'Manager · Quản lý',BOD:'BOD · Giám sát'};const now=()=>new Date().toISOString();const isoDaysAgo=d=>new Date(Date.now()-d*86400000).toISOString();const dateFmt=x=>x?new Date(x).toLocaleString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>Math.random().toString(36).slice(2,10);const workerNames=['Nguyễn Thị Lan','Trần Văn Minh','Lê Thị Hương','Phạm Văn Hùng','Đỗ Thị Mai'];
function seed(){const users=[{id:'u-root',name:'System Root',role:'ROOT',hamlets:[],active:true},{id:'u-admin',name:'Nguyễn Thị Thu',role:'ADMIN',hamlets:[],active:true},{id:'u-nv1',name:'Nguyễn Thị Lan',role:'NVYT',hamlets:['Ấp 1','Ấp 2'],active:true},{id:'u-nv2',name:'Trần Văn Minh',role:'NVYT',hamlets:['Ấp 1','Ấp 3'],active:true},{id:'u-nv3',name:'Lê Thị Hương',role:'NVYT',hamlets:['Ấp 2','Ấp 4'],active:true},{id:'u-nv4',name:'Phạm Văn Hùng',role:'NVYT',hamlets:['Ấp 5','Ấp 6','Ấp 12'],active:true},{id:'u-nv5',name:'Đỗ Thị Mai',role:'NVYT',hamlets:['Ấp 7','Ấp 8','Ấp 12'],active:true},{id:'u-manager',name:'Võ Thị Phương',role:'MANAGER',hamlets:[],active:true},{id:'u-bod',name:'Bùi Văn Nam',role:'BOD',hamlets:[],active:true}];const people=['Nguyễn Văn An','Trần Thị Bình','Lê Minh Châu','Phạm Gia Hân','Đặng Thanh Phúc','Hồ Thị Như','Vũ Anh Khoa','Mai Thảo Nhi','Trịnh Quốc Bảo','Lâm Thị Xuân','Ngô Minh Tú','Đỗ Phương Uyên','Huỳnh Gia Long','Phan Thị Hòa','Bùi Văn Đạt','Tạ Ngọc Anh'];const cases=people.map((name,i)=>{let h=HAMLETS[i%12];let loc=i===13?'UNKNOWN':i===14?'OUTSIDE':'IN';let status=STATUSES[i%3];let received=isoDaysAgo(i%5);return {id:'DT-'+String(260101+i).padStart(6,'0'),name,disease:DISEASES[i%6],hamlet:loc==='IN'?h:null,originHamlet:loc==='IN'?h:null,location:loc,status,receivedAt:received,slaAnchor:received,verifiedAt:status!=='VERIFYING'?isoDaysAgo(Math.max(0,i%5-1)):null,resolvedAt:status==='RESOLVED'?isoDaysAgo(Math.max(0,i%5-2)):null,lost:i===8,reportStatus:i%2?'Đã báo cáo':'Hoàn thành',sourceReportedAt:isoDaysAgo(i%8+2),supporters:[],primary:null,notes:'Dữ liệu bệnh nhân giả lập phục vụ kiểm thử giao diện.',source:'Excel mẫu'};});cases[15].location='OUTSIDE';cases[15].hamlet=null;cases[15].originHamlet='Ấp 4';return {users,cases,logs:cases.map(c=>({id:id(),caseId:c.id,actor:'Hệ thống demo',action:'Tạo ca từ dữ liệu giả lập',at:c.receivedAt})),imports:[],settings:{site:'Trạm Y tế xã Đông Thạnh'}}}let state=seed();let role='ADMIN',currentUser='u-admin',page='dashboard',selectedCase=null,detailTab='info',filterText='',filterStatus='',filterLocation='',caseSort='recent';
const isAdmin=()=>['ROOT','ADMIN'].includes(role);const isReadOnly=()=>['MANAGER','BOD'].includes(role);const me=()=>state.users.find(u=>u.id===currentUser);const isNVYT=()=>role==='NVYT';const canSee=c=>role!=='NVYT'||(c.location==='IN'&&!!c.hamlet&&(me()?.hamlets.includes(c.hamlet)||c.supporters.includes(currentUser))&&!c.revokedFor?.includes(currentUser));const visible=()=>state.cases.filter(canSee);const canEdit=c=>!isReadOnly()&&canSee(c);const getUser=id=>state.users.find(u=>u.id===id);const workers=()=>state.users.filter(u=>u.role==='NVYT'&&u.active);const workersFor=h=>workers().filter(u=>u.hamlets.includes(h));function log(c,action){state.logs.unshift({id:id(),caseId:c?.id||null,actor:me()?.name||'Demo',action,at:now()})}function notify(t){document.getElementById('toastRoot').innerHTML='<div class="toast">✓ '+esc(t)+'</div>';setTimeout(()=>document.getElementById('toastRoot').innerHTML='',3300)}function btn(label,onclick,cls=''){return `<button class="btn ${cls}" onclick="${onclick}">${label}</button>`}function badgeStatus(s){return `<span class="tag ${s==='RESOLVED'?'green':s==='VERIFIED'?'blue':'amber'}">● ${STLABEL[s]}</span>`}function locLabel(c){return c.location==='OUTSIDE'?'<span class="tag red">Ngoài xã</span>':c.location==='UNKNOWN'?'<span class="tag amber">Chưa rõ ấp</span>':`<span class="tag">${esc(c.hamlet)}</span>`}function sla(c){if(c.status==='RESOLVED')return {label:'Đã xử lý',cls:'green'};const d=new Date(c.slaAnchor||c.receivedAt);const day=new Date(d.toLocaleString('en-US',{timeZone:'Asia/Ho_Chi_Minh'}));day.setHours(0,0,0,0);const diff=(Date.now()-day.getTime())/86400000;if(diff>=3)return {label:'Quá hạn xử lý',cls:'red'};if(diff>=2.5)return {label:'Sắp trễ xử lý',cls:'amber'};if(diff>=1.5&&c.status==='VERIFYING')return {label:'Sắp trễ xác minh',cls:'amber'};return {label:'Trong hạn',cls:'blue'}}function slaBadge(c){const s=sla(c);return `<span class="tag ${s.cls}">${s.label}</span>`}function title(t,sub,actions=''){return `<div class="heading"><div><div class="eyebrow">HỆ THỐNG GIÁM SÁT DỊCH BỆNH</div><h1>${t}</h1><p class="sub">${sub}</p></div><div class="actions">${actions}</div></div>`}function switchRole(r){role=r;currentUser=({ROOT:'u-root',ADMIN:'u-admin',NVYT:'u-nv1',MANAGER:'u-manager',BOD:'u-bod'})[r];page='dashboard';selectedCase=null;filterText='';render();notify('Đã chuyển sang vai trò '+ROLELABEL[r])}function navItems(){const common=[['dashboard','◫','Tổng quan'],['cases','▤','Danh sách ca bệnh']];if(!isReadOnly())common.push(['history','◷','Lịch sử ca bệnh']);if(isAdmin())common.push(['create','＋','Tạo ca mới'],['import','⇪','Import Excel'],['classification','⌖','Phân loại địa bàn'],['users','♙','Tài khoản & phân ấp'],['audit','≡','Audit toàn hệ thống'],['reports','▥','Báo cáo']);else if(isReadOnly())common.push(['reports','▥','Báo cáo']);return common}function renderNav(){document.getElementById('navigation').innerHTML=navItems().map(([p,ic,n])=>`<button class="nav ${page===p?'active':''}" onclick="navigate('${p}')"><span class="ico">${ic}</span>${n}${p==='classification'?`<span class="count">${state.cases.filter(c=>c.location!=='IN').length}</span>`:''}</button>`).join('');document.getElementById('rolePicker').innerHTML=Object.entries(ROLELABEL).map(([k,v])=>`<option value="${k}" ${k===role?'selected':''}>${v}</option>`).join('');document.getElementById('avatar').textContent=me()?.name.split(' ').slice(-1)[0][0]||'A'}function navigate(p){page=p;selectedCase=null;document.getElementById('sidebar').classList.remove('open');render()}function render(){if(!navItems().some(x=>x[0]===page)&&page!=='detail')page='dashboard';renderNav();document.getElementById('breadcrumb').textContent=page==='detail'?'Chi tiết ca bệnh':(navItems().find(x=>x[0]===page)||[])[2]||'Tổng quan';const map={dashboard:dashboard,cases:casesPage,detail:detailPage,create:createPage,import:importPage,classification:classificationPage,users:usersPage,history:historyPage,audit:auditPage,reports:reportsPage};document.getElementById('content').innerHTML=(map[page]||dashboard)()}function dashboard(){const v=visible(),open=v.filter(c=>c.status!=='RESOLVED'),late=open.filter(c=>sla(c).cls==='red'),done=v.filter(c=>c.status==='RESOLVED'),unknown=v.filter(c=>c.location!=='IN');const per=HAMLETS.map(h=>({h,n:v.filter(c=>c.hamlet===h).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n).slice(0,6);const actions=isAdmin()?btn('＋ Tạo ca','navigate(\'create\')','primary')+btn('⇪ Import Excel','navigate(\'import\')'):'';return title(role==='NVYT'?'Tổng quan công việc của tôi':'Tổng quan ca bệnh',role==='NVYT'?'Chỉ hiển thị ca thuộc ấp được phân công hoặc ca được cấp quyền hỗ trợ.':'Số liệu tổng hợp theo phạm vi quyền truy cập của vai trò hiện tại.',actions)+`<div class="hero"><div><h2>Chào mừng, ${esc(me()?.name)} 👋</h2><p>${role==='NVYT'?'Các ca thuộc quyền xử lý của bạn được cập nhật tại đây.':'Theo dõi tình hình tiếp nhận, xác minh và xử lý ca bệnh tại trạm.'}<br>Hệ thống demo · dữ liệu giả lập · múi giờ Việt Nam</p></div><span style="font-size:47px;opacity:.6">✚</span></div><div class="grid metrics">${[['Tổng số ca',v.length,'Tất cả ca trong phạm vi','#e8f0ff'],['Đang xử lý',open.length,'Chưa hoàn thành','#fff1dc'],['Quá hạn hiện tại',late.length,'Cần ưu tiên xử lý','#ffedf0'],['Đã xử lý',done.length,'Theo trạng thái hiện tại','#e2f7f0']].map(([l,n,f,t])=>`<div class="card metric" style="--tint:${t}"><div class="label">${l}</div><div class="value">${n}</div><div class="foot">${f}</div></div>`).join('')}</div><div class="grid panels"><div class="card panel"><div class="panel-title"><h2>Phân bố ca theo ấp</h2><small>${per.length} địa bàn</small></div>${per.map(x=>`<div class="barline"><div class="barline-head"><b>${x.h}</b><span>${x.n} ca</span></div><div class="track"><div class="fill" style="width:${x.n/Math.max(...per.map(z=>z.n))*100}%"></div></div></div>`).join('')||'<div class="empty">Chưa có dữ liệu</div>'}${role!=='NVYT'?`<div class="divider"></div><div class="pill-info"><span class="count-b function tableCases(arr){if(!arr.length)return '<div class="empty">✦ Không có ca bệnh phù hợp</div>';return `<div class="table-wrap"><table class="table"><thead><tr><th>Mã ca / Bệnh nhân</th><th>Bệnh</th><th>Địa bàn</th><th>Trạng thái</th><th>SLA</th><th>Tiếp nhận</th><th></th></tr></thead><tbody>${arr.map(c=>`<tr><td><span class="caseid">${esc(c.id)}</span><br><span class="person">${esc(c.name)}</span>${c.lost?' <span class="tag purple">Mất dấu</span>':''}</td><td>${esc(c.disease)}</td><td>${locLabel(c)}</td><td>${badgeStatus(c.status)}</td><td>${slaBadge(c)}</td><td class="muted">${dateFmt(c.receivedAt)}</td><td>${btn('Xem →',`openCase('${c.id}')`,'sm ghost')}</td></tr>`).join('')}</tbody></table></div>`}
function casesPage(){const v=visible().filter(c=>(!filterText||[c.id,c.name,c.disease,c.hamlet||''].join(' ').toLowerCase().includes(filterText.toLowerCase()))&&(!filterStatus||c.status===filterStatus)&&(!filterLocation||c.location===filterLocation));return title('Danh sách ca bệnh',role==='NVYT'?'Danh sách đã lọc theo ấp và quyền hỗ trợ của bạn.':'Tra cứu, lọc và xem chi tiết ca bệnh.',isAdmin()?btn('＋ Tạo ca','navigate(\'create\')','primary'):'')+`<div class="toolbar"><input class="search" id="q" placeholder="⌕ Tìm mã ca, bệnh nhân, bệnh, ấp..." value="${esc(filterText)}" oninput="filterText=this.value;refreshTable()"><select class="control" id="statusFilter" onchange="filterStatus=this.value;refreshTable()"><option value="">Mọi trạng thái</option>${STATUSES.map(s=>`<option ${filterStatus===s?'selected':''} value="${s}">${STLABEL[s]}</option>`).join('')}</select><select class="control" onchange="filterLocation=this.value;refreshTable()"><option value="">Mọi địa bàn</option><option value="IN" ${filterLocation==='IN'?'selected':''}>Trong xã</option><option value="OUTSIDE" ${filterLocation==='OUTSIDE'?'selected':''}>Ngoài xã</option><option value="UNKNOWN" ${filterLocation==='UNKNOWN'?'selected':''}>Chưa rõ ấp</option></select></div><div class="card"><div class="panel-title" style="padding:18px 20px 0"><h2>Danh sách (${v.length})</h2><span class="muted mini">Nhấn “Xem” để mở hồ sơ</span></div><div id="caseTable">${tableCases(v)}</div></div>`}function refreshTable(){const v=visible().filter(c=>(!filterText||[c.id,c.name,c.disease,c.hamlet||''].join(' ').toLowerCase().includes(filterText.toLowerCase()))&&(!filterStatus||c.status===filterStatus)&&(!filterLocation||c.location===filterLocation));document.getElementById('caseTable').innerHTML=tableCases(v)}function openCase(i){selectedCase=i;detailTab='info';page='detail';render()}

function showModal(name,html,foot){document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>${name}</h2><button class="close" onclick="closeModal()">×</button></div>${html}<div class="modal-foot">${btn('Hủy','closeModal()')}${foot}</div></div></div>`}function closeModal(){document.getElementById('modalRoot').innerHTML=''}function showTransfer(){const c=state.cases.find(x=>x.id===selectedCase);if(!canEdit(c))return;showModal('Chuyển ấp / phân loại địa bàn',`<div class="notice warn">Chuyển ấp có hiệu lực ngay, thu hồi quyền theo địa bàn cũ và reset SLA. Chuyển ngoài xã/chưa rõ ấp sẽ chỉ còn Admin/Manager/BOD/Root xem.</div><div class="field"><label>Phân loại mới</label><select id="trLoc" onchange="document.getElementById('trHamletBox').style.display=this.value==='IN'?'block':'none'"><option value="IN">Trong xã — chuyển ấp</option><option value="OUTSIDE">Ngoài xã</option><option value="UNKNOWN">Chưa rõ ấp</option></select></div><div class="field" id="trHamletBox"><label>Ấp mới</label><select id="trHamlet">${HAMLETS.map(h=>`<option value="${h}" ${c.hamlet===h?'selected':''}>${h}</option>`).join('')}</select></div><div class="field"><label>Lý do chuyển *</label><textarea id="trReason" placeholder="Nhập lý do điều chỉnh địa bàn..."></textarea></div>`,btn('Xác nhận chuyển','applyTransfer()','primary'))}function applyTransfer(){const c=state.cases.find(x=>x.id===selectedCase);if(!canEdit(c))return;const loc=document.getElementById('trLoc').value,h=loc==='IN'?document.getElementById('trHamlet').value:null,reason=document.getElementById('trReason').value.trim();if(!reason)return alert('Vui lòng nhập lý do');if(loc===c.location&&h===c.hamlet)return alert('Địa bàn chưa thay đổi');const old=c.hamlet||c.location,oldLoc=c.location;c.location=loc;c.hamlet=h;c.supporters=[];c.primary=null;c.revokedFor=[];if(loc==='IN'&&oldLoc==='IN'&&old!==h){c.slaAnchor=now()}log(c,`Chuyển địa bàn ${old} → ${h||loc}; lý do: ${reason}${loc==='IN'&&oldLoc==='IN'?'; reset SLA':''}`);closeModal();if(!canSee(c)){navigate('cases');notify('Đã chuyển ca; quyền NVYT cũ đã thu hồi')}else{render();notify('Đã cập nhật địa bàn và ghi log')}}function showSupport(){const c=state.cases.find(x=>x.id===selectedCase);if(!canEdit(c))return;showModal('Chỉ định / thu hồi người hỗ trợ',`<div class="field"><label>Hành động</label><select id="spAction"><option value="add">Thêm người hỗ trợ</option><option value="remove">Thu hồi quyền hỗ trợ</option></select></div><div class="field"><label>Nhân viên y tế</label><select id="spUser">${workers().map(u=>`<option value="${u.id}">${esc(u.name)} · ${esc(u.hamlets.join(', '))}</option>`).join('')}</select></div><div class="field"><label>Lý do *</label><textarea id="spReason" placeholder="Vì sao cần thêm hoặc thu hồi người hỗ trợ?"></textarea></div>`,btn('Xác nhận','applySupport()','primary'))}function applySupport(){const c=state.cases.find(x=>x.id===selectedCase);if(!canEdit(c))return;const a=document.getElementById('spAction').value,u=document.getElementById('spUser').value,r=document.getElementById('spReason').value.trim();if(!r)return alert('Phải nhập lý do');if(a==='add'&&!c.supporters.includes(u))c.supporters.push(u);if(a==='remove')c.supporters=c.supporters.filter(x=>x!==u);log(c,(a==='add'?'Chỉ định':'Thu hồi')+' người hỗ trợ '+getUser(u)?.name+'; lý do: '+r);closeModal();render();notify('Đã cập nhật người hỗ trợ')}function showLost(){const c=state.cases.find(x=>x.id===selectedCase);if(!canEdit(c))return;showModal('Ghi nhận mất dấu',`<div class="notice">Ấp gốc ${esc(c.originHamlet||'chưa xác định')} vẫn được giữ để báo cáo. Mất dấu là nhãn nghiệp vụ riêng, không phải trạng thái xử lý.</div><div class="field"><label>Ghi nhận</label><select id="lostValue"><option value="yes" ${c.lost?'selected':''}>Mất dấu</option><option value="no" ${!c.lost?'selected':''}>Không còn mất dấu</option></select></div><div class="field"><label>Lý do / kết quả xác minh *</label><textarea id="lostReason" placeholder="Ví dụ: đến địa chỉ ghi nhận nhưng không tìm thấy người bệnh..."></textarea></div>`,btn('Lưu ghi nhận','applyLost()','primary'))}function applyLost(){const c=state.cases.find(x=>x.id===selectedCase);if(!canEdit(c))return;const r=document.getElementById('lostReason').value.trim();if(!r)return alert('Cần nhập lý do');c.lost=document.getElementById('lostValue').value==='yes';log(c,(c.lost?'Đánh dấu mất dấu':'Bỏ nhãn mất dấu')+'; lý do: '+r);closeModal();render();notify('Đã cập nhật nhãn mất dấu')}function showDates(){if(!isAdmin())return;const c=state.cases.find(x=>x.id===selectedCase);const val=x=>x?new Date(x).toISOString().slice(0,16):'';showModal('Điều chỉnh thời điểm nghiệp vụ',`<div class="notice warn">Chỉ Root/Admin được sửa. Thao tác phải lưu lý do và audit log.</div><div class="field"><label>verified_at</label><input id="dtVerified" type="datetime-local" value="${val(c.verifiedAt)}"></div><div class="field"><label>resolved_at</label><input id="dtResolved" type="datetime-local" value="${val(c.resolvedAt)}"></div><div class="field"><label>Lý do chỉnh sửa *</label><textarea id="dtReason"></textarea></div>`,btn('Lưu điều chỉnh','applyDates()','primary'))}function applyDates(){if(!isAdmin())return;const c=state.cases.find(x=>x.id===selectedCase),r=document.getElementById('dtReason').value.trim();if(!r)return alert('Cần nhập lý do');const old=`${c.verifiedAt||'—'} / ${c.resolvedAt||'—'}`;const cv=id=>document.getElementById(id).value?new Date(document.getElementById(id).value).toISOString():null;c.verifiedAt=cv('dtVerified');c.resolvedAt=cv('dtResolved');log(c,`Admin chỉnh verified_at / resolved_at từ ${old} thành ${c.verifiedAt||'—'} / ${c.resolvedAt||'—'}; lý do: ${r}`);closeModal();render();notify('Đã cập nhật thời điểm')}
function createPage(){if(!isAdmin())return dashboard();return title('Tạo ca bệnh mới','Chỉ Root/Admin được tạo đầu vào ca bệnh. received_at và trạng thái mặc định do backend quyết định.')+`<div class="card panel" style="max-width:770px"><div class="notice">Ca mới mặc định <b>Đang xác minh</b>; ngày tiếp nhận nội bộ được tự ghi khi xác nhận tạo, không lấy ngày bệnh viện báo cáo.</div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px"><div class="field"><label>Họ tên bệnh nhân (demo) *</label><input id="newName" placeholder="Ví dụ: Nguyễn Văn A"></div><div class="field"><label>Loại bệnh *</label><select id="newDisease">${DISEASES.map(d=>`<option>${d}</option>`).join('')}</select></div><div class="field"><label>Phân loại địa bàn</label><select id="newLoc" onchange="document.getElementById('newHamletField').style.display=this.value==='IN'?'grid':'none'"><option value="IN">Trong xã</option><option value="UNKNOWN">Chưa rõ ấp</option><option value="OUTSIDE">Ngoài xã</option></select></div><div class="field" id="newHamletField"><label>Ấp</label><select id="newHamlet">${HAMLETS.map(h=>`<option>${h}</option>`).join('')}</select></div></div><div class="field"><label>Ghi chú</label><textarea id="newNotes" placeholder="Thông tin tiếp nhận..."></textarea></div><div class="actions">${btn('＋ Tạo ca bệnh','createCase()','primary')}${btn('Hủy','navigate(\'cases\')')}</div></div>`}function createCase(){if(!isAdmin())return;const name=document.getElementById('newName').value.trim();if(!name)return alert('Nhập tên bệnh nhân');const loc=document.getElementById('newLoc').value,h=loc==='IN'?document.getElementById('newHamlet').value:null;const c={id:'DT-'+String(Date.now()).slice(-8),name,disease:document.getElementById('newDisease').value,hamlet:h,originHamlet:h,location:loc,status:'VERIFYING',receivedAt:now(),slaAnchor:now(),verifiedAt:null,resolvedAt:null,lost:false,reportStatus:'—',sourceReportedAt:null,supporters:[],primary:null,notes:document.getElementById('newNotes').value,source:'Tạo thủ công'};state.cases.unshift(c);log(c,'Admin tạo ca mới, trạng thái mặc định Đang xác minh');openCase(c.id);notify('Đã tạo ca mới và cấp quyền theo ấp')}
function importPage(){if(!isAdmin())return dashboard();return title('Import danh sách Excel','Luồng demo: tải file → xem trước → chọn cách xử lý → xác nhận tạo ca. Chỉ Root/Admin có quyền.')+`<div class="grid panels"><div class="card panel"><div class="panel-title"><h2>01 · Tải danh sách ca bệnh</h2><span class="tag blue">XLSX / CSV demo</span></div><div class="notice">Bản demo một file hỗ trợ <b>CSV UTF-8</b> thực tế. Với .xlsx, demo dùng dữ liệu mô phỏng; hệ thống Django thật sẽ đọc .xlsx trên server, mapping và validate đầy đủ.</div><div class="field"><label>Chọn file nguồn (tùy chọn)</label><input type="file" id="importFile" accept=".csv,.xlsx,.xls" onchange="previewImportFile(this)"></div><div class="actions">${btn('Xem trước dữ liệu mẫu','showImportPreview()','primary')}${btn('Tải CSV mẫu','downloadCSV()')}</div><div class="divider"></div><h2 style="margin-bottom:13px">02 · Kiểm tra & xác nhận</h2><div id="importPreview" class="empty">Chưa có dữ liệu xem trước</div></div><div class="card panel"><h2>Quy tắc import</h2><div class="divider"></div>${['Ca mới luôn mặc định Đang xác minh','Ngày tiếp nhận = thời điểm ghi ca vào hệ thống nội bộ','Tự cấp quyền NVYT theo ấp, không tự chọn người phụ trách chính','Ngoài xã / chưa rõ ấp không cấp quyền NVYT','Phát hiện trùng: không ghi đè, đưa vào đối chiếu','Trạng thái báo cáo nguồn độc lập trạng thái xử lý'].map(t=>`<div class="activity"><span class="dot"></span><div><b>${t}</b></div></div>`).join('')}<div class="divider"></div><h2>Đợt import gần đây</h2>${state.imports.map(x=>`<div class="activity"><div><b>${x.count} ca · ${esc(x.source)}</b><small>${dateFmt(x.at)}</small></div></div>`).join('')||'<p class="sub" style="margin-top:12px">Chưa có đợt import trong phiên demo.</p>'}</div></div>`}let importRows=[];function showImportPreview(){importRows=[{name:'Bệnh nhân Demo 01',disease:'Sốt xuất huyết',hamlet:'Ấp 1',location:'IN'},{name:'Bệnh nhân Demo 02',disease:'Tay chân miệng',hamlet:'Ấp 12',location:'IN'},{name:'Bệnh nhân Demo 03',disease:'Sởi',hamlet:null,location:'UNKNOWN'},{name:state.cases[0].name,disease:state.cases[0].disease,hamlet:state.cases[0].hamlet,location:state.cases[0].location}];paintImportPreview()}function previewImportFile(input){if(!input.files.length)return;const f=input.files[0];if(!f.name.toLowerCase().endsWith('.csv')){notify('Đã nhận tên file. Demo .xlsx sử dụng preview mô phỏng');showImportPreview();return}const reader=new FileReader();reader.onload=()=>{const lines=String(reader.result).replace(/^\uFEFF/,'').trim().split(/\r?\n/);const headers=lines.shift().split(',').map(x=>x.trim().toLowerCase());const ix=k=>headers.indexOf(k);if(!['name','disease','hamlet'].every(k=>ix(k)>=0)){alert('CSV mẫu cần có header: name,disease,hamlet');return}importRows=lines.slice(0,100).map(line=>{const a=line.split(',');const h=(a[ix('hamlet')]||'').trim();return {name:(a[ix('name')]||'').trim(),disease:(a[ix('disease')]||'').trim(),hamlet:h||null,location:h?'IN':'UNKNOWN'}}).filter(x=>x.name);paintImportPreview()};reader.readAsText(f,'UTF-8')}function paintImportPreview(){const el=document.getElementById('importPreview');if(!el)return;el.innerHTML=`<p class="section-note">${importRows.length} dòng · dòng trùng tên + bệnh được gợi ý đối chiếu, mặc định bỏ qua.</p><div class="table-wrap"><table class="table"><thead><tr><th>Bệnh nhân</th><th>Bệnh</th><th>Ấp</th><th>Kết quả</th></tr></thead><tbody>${importRows.map(r=>{const dup=state.cases.some(c=>c.name===r.name&&c.disease===r.disease);return `<tr><td>${esc(r.name)}</td><td>${esc(r.disease)}</td><td>${esc(r.hamlet||'Chưa rõ')}</td><td>${dup?'<span class="tag amber">Nghi trùng · bỏ qua</span>':'<span class="tag green">Ca mới</span>'}</td></tr>`}).join('')}</tbody></table></div><div style="margin-top:14px">${btn('Xác nhận import ca mới','commitImport()','primary')}</div>`}function commitImport(){if(!isAdmin())return;let count=0;importRows.forEach(r=>{if(state.cases.some(c=>c.name===r.name&&c.disease===r.disease))return;const c={id:'DT-'+String(Date.now()+count).slice(-8),name:r.name,disease:r.disease,hamlet:r.hamlet,originHamlet:r.hamlet,location:r.location,status:'VERIFYING',receivedAt:now(),slaAnchor:now(),verifiedAt:null,resolvedAt:null,lost:false,reportStatus:'Đã báo cáo',sourceReportedAt:isoDaysAgo(2),supporters:[],primary:null,notes:'Import demo',source:'Import Excel demo'};state.cases.unshift(c);log(c,'Import tạo ca mới');count++});state.imports.unshift({at:now(),count,source:'Dữ liệu xem trước'});importRows=[];render();notify('Đã import '+count+' ca mới; dòng nghi trùng được bỏ qua')}function downloadCSV(){const content='name,disease,hamlet\nBệnh nhân Ví dụ,Sốt xuất huyết,Ấp 1\nBệnh nhân Ví dụ 2,Sởi,Ấp 2';const blob=new Blob(['\uFEFF'+content],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tyt_import_demo.csv';a.click();URL.revokeObjectURL(a.href)}
function classificationPage(){if(!isAdmin())return dashboard();const arr=state.cases.filter(c=>c.location!=='IN');return title('Phân loại địa bàn','Ca ngoài xã và chưa rõ ấp được giữ lại, chưa cấp quyền NVYT. Admin phân loại thủ công.')+`<div class="card panel"><div class="panel-title"><h2>Hàng chờ phân loại (${arr.length})</h2><span class="tag amber">Chỉ Root/Admin thao tác</span></div>${tableCases(arr)}</div><p class="section-note">Mở hồ sơ → Chuyển địa bàn để chọn ấp mới. Manager/BOD xem được các ca này ở danh sách tổng hợp.</p>`}function usersPage(){if(!isAdmin())return dashboard();const users=state.users.filter(u=>u.role!=='ROOT');return title('Tài khoản & phân công ấp','Root không xuất hiện trong danh sách quản trị. Một NVYT có thể phụ trách nhiều ấp; một ấp có thể có nhiều NVYT.',btn('＋ Thêm NVYT','showAddUser()','primary'))+`<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Họ tên</th><th>Vai trò</th><th>Ấp phụ trách</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>${users.map(u=>`<tr><td><span class="person">${esc(u.name)}</span></td><td><span class="tag ${u.role==='NVYT'?'blue':''}">${u.role}</span></td><td style="white-space:normal;max-width:340px">${esc(u.hamlets.join(', ')||'—')}</td><td><span class="tag ${u.active?'green':'red'}">${u.active?'Đang hoạt động':'Ngừng hoạt động'}</span></td><td>${u.role==='NVYT'?btn('Phân ấp',`showAssign('${u.id}')`,'sm ghost')+btn(u.active?'Vô hiệu':'Kích hoạt',`toggleUser('${u.id}')`,'sm'):''}</td></tr>`).join('')}</tbody></table></div></div>`}function showAddUser(){if(!isAdmin())return;showModal('Thêm nhân viên y tế',`<div class="field"><label>Họ tên *</label><input id="addName" placeholder="Họ và tên"></div><div class="field"><label>Vai trò</label><select id="addRole"><option value="NVYT">NVYT</option><option value="MANAGER">Manager</option><option value="BOD">BOD</option><option value="ADMIN">Admin</option></select></div>`,btn('Tạo tài khoản demo','addUser()','primary'))}function addUser(){const n=document.getElementById('addName').value.trim();if(!n)return alert('Nhập họ tên');state.users.push({id:'u-'+id(),name:n,role:document.getElementById('addRole').value,hamlets:[],active:true});log(null,'Tạo tài khoản '+n);closeModal();render();notify('Đã tạo tài khoản demo')}function showAssign(uid){const u=getUser(uid);if(!isAdmin()||!u||u.role!=='NVYT')return;showModal('Phân công ấp · '+esc(u.name),`<p class="sub" style="margin-bottom:14px">Có thể chọn nhiều ấp. Thay đổi quyền có hiệu lực với ca thuộc địa bàn tương ứng.</p><div class="grid" style="grid-template-columns:repeat(3,1fr);gap:10px">${HAMLETS.map(h=>`<label class="toggle"><input type="checkbox" class="hamletCheck" value="${h}" ${u.hamlets.includes(h)?'checked':''}>${h}</label>`).join('')}</div>`,btn('Lưu phân công',`applyAssign('${uid}')`,'primary'))}function applyAssign(uid){if(!isAdmin())return;const u=getUser(uid),old=u.hamlets.join(', ');u.hamlets=[...document.querySelectorAll('.hamletCheck:checked')].map(x=>x.value);log(null,`Phân công ấp ${u.name}: ${old} → ${u.hamlets.join(', ')}`);closeModal();render();notify('Đã cập nhật ấp phụ trách')}function toggleUser(uid){if(!isAdmin())return;const u=getUser(uid);if(!u||u.role==='ROOT')return;if(u.active&&state.cases.some(c=>c.primary===uid&&c.status!=='RESOLVED'))return alert('NVYT đang phụ trách ca mở. Cần bàn giao trước khi vô hiệu hóa.');u.active=!u.active;log(null,(u.active?'Kích hoạt':'Vô hiệu hóa')+' tài khoản '+u.name);render();notify('Đã cập nhật tài khoản')}
function historyPage(){const arr=state.logs.filter(x=>x.caseId&&visible().some(c=>c.id===x.caseId));return title('Lịch sử ca bệnh','Nhật ký thay đổi thuộc các ca mà vai trò hiện tại có quyền truy cập.')+`<div class="card panel">${timeline(arr.slice(0,100))}</div>`}function auditPage(){if(!isAdmin())return dashboard();return title('Audit log toàn hệ thống','Chỉ Root/Admin được xem nhật ký toàn hệ thống, bao gồm tài khoản, phân công, import và cập nhật ca.')+`<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Thời điểm</th><th>Người thao tác</th><th>Đối tượng</th><th>Nội dung</th></tr></thead><tbody>${state.logs.slice(0,150).map(x=>`<tr><td>${dateFmt(x.at)}</td><td>${esc(x.actor)}</td><td>${esc(x.caseId||'Hệ thống')}</td><td style="white-space:normal;min-width:300px">${esc(x.action)}</td></tr>`).join('')}</tbody></table></div></div>`}function reportsPage(){const v=visible(),diseases=DISEASES.map(d=>({d,n:v.filter(c=>c.disease===d).length})).filter(x=>x.n),late=v.filter(c=>c.status!=='RESOLVED'&&sla(c).cls==='red'),doneLate=v.filter(c=>c.status==='RESOLVED'&&c.resolvedAt&&((new Date(c.resolvedAt)-new Date(c.slaAnchor||c.receivedAt))/86400000>=3));return title('Báo cáo & thống kê',role==='NVYT'?'Số liệu cá nhân theo ca được phép xem.':'Số liệu tổng hợp theo tình trạng hiện tại và ngày tiếp nhận nội bộ.')+`<div class="grid metrics">${[['Tổng số ca',v.length],['Quá hạn đang mở',late.length],['Hoàn thành trễ',doneLate.length],['Ca mất dấu',v.filter(c=>c.lost).length]].map(([t,n])=>`<div class="card metric"><div class="label">${t}</div><div class="value">${n}</div></div>`).join('')}</div><div class="grid panels"><div class="card panel"><div class="panel-title"><h2>Phân bố theo loại bệnh</h2></div>${diseases.map(x=>`<div class="barline"><div class="barline-head"><b>${x.d}</b><span>${x.n}</span></div><div class="track"><div class="fill" style="width:${x.n/Math.max(...diseases.map(z=>z.n))*100}%"></div></div></div>`).join('')}</div><div class="card panel"><h2>Nguyên tắc thống kê</h2><div class="divider"></div><p class="sub">• Quá hạn đang mở và hoàn thành trễ được tách riêng.<br>• Ngày tiếp nhận nội bộ dùng cho báo cáo, không dùng ngày bệnh viện báo cáo.<br>• Ca mất dấu vẫn gắn với ấp ban đầu.<br>• NVYT chỉ thấy dữ liệu thuộc quyền; Manager/BOD có quyền đọc toàn trạm.<br>• Reset SLA khi chuyển ấp được lưu trong lịch sử.</p><div class="divider"></div>${btn('Xuất CSV danh sách đang xem','exportCases()','ghost')}</div></div>`}function exportCases(){const rows=[['Mã ca','Bệnh nhân','Bệnh','Ấp','Trạng thái','Tiếp nhận'],...visible().map(c=>[c.id,c.name,c.disease,c.hamlet||c.location,STLABEL[c.status],dateFmt(c.receivedAt)])];const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='tyt_bao_cao_demo.csv';a.click();URL.revokeObjectURL(a.href)}function resetDemo(){if(!confirm('Khôi phục toàn bộ dữ liệu demo?'))return;state=seed();page='dashboard';render();notify('Đã khôi phục dữ liệu giả lập')}render();
</script></body></html>
